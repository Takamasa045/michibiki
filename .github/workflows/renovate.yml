name: Renovate

on:
  workflow_dispatch:
  schedule:
    # Run often so fast-moving video engines are picked up close to publish time.
    - cron: "15 */3 * * *"

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate dependency updates
    runs-on: ubuntu-latest
    if: github.repository == 'Takamasa045/michibiki'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Renovate token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "::error::Set RENOVATE_TOKEN as a repository secret before running Renovate."
            echo "::error::Use a PAT with public_repo/repo scope and workflow scope, or a GitHub App token with equivalent repository permissions."
            exit 1
          fi

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.1.19
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
