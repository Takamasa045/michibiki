packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 0
blockExoticSubdeps: true
strictDepBuilds: true
overrides:
  esbuild: 0.28.1
  protobufjs: 8.7.1
  ws: 8.21.1
  # Transitive @hyperframes/* security pins. JS packages stay on the current
  # major; sharp is the patched 0.35.x (0.34.x has no high-severity fix).
  hono: 4.13.13
  "@hono/node-server": 1.19.17
  postcss: 8.5.30
  postcss-selector-parser: 7.1.6
  nanoid: 3.3.20
  source-map-js: 1.2.2
  adm-zip: 0.6.1
  sharp: 0.35.5

allowBuilds:
  '@google/genai': false
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  puppeteer: false
  sharp: false
