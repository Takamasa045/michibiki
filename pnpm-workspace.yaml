packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 0
blockExoticSubdeps: true
strictDepBuilds: true
overrides:
  esbuild: 0.28.2
  protobufjs: 8.8.1
  ws: 8.23.0
  # Transitive @hyperframes/* security pins. JS packages stay on the current
  # major; sharp is the patched 0.35.x (0.34.x has no high-severity fix).
  hono: 4.13.20
  "@hono/node-server": 1.19.19
  postcss: 8.5.33
  postcss-selector-parser: 7.2.1
  nanoid: 3.3.20
  source-map-js: 1.2.4
  adm-zip: 0.6.1
  sharp: 0.35.5

allowBuilds:
  '@google/genai': false
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  puppeteer: false
  sharp: false
